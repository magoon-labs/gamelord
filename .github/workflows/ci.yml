name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Merge-group refs are unique per queue entry (gh-readonly-queue/main/pr-N-<sha>),
# so queue runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No CI job launches Electron; skip the ~100MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # Vercel Remote Cache, shared by PR, merge-queue, and main runs. Artifacts
  # are signed (remoteCache.signature in turbo.json) and verified on read.
  # Unset for fork and Dependabot runs, which fall back to running everything.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Gates only Chromatic and the native build. Lint and test jobs start
    # immediately: the Turbo remote cache already turns unchanged work into a
    # replay, so waiting on this job would only add latency. paths-filter
    # diffs merge-group runs against merge_group.base_sha, and skipped jobs
    # still report their required check name through the *-skip twins.
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ui:
              - 'packages/ui/**'
              - 'apps/desktop/src/renderer/components/**'
            native:
              - 'apps/desktop/native/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  lint-typecheck-format:
    name: Lint, Type Check & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/turbo-cache-check
        id: turbo
        with:
          tasks: lint typecheck format:check bundle

      - uses: ./.github/actions/setup
        if: steps.turbo.outputs.all-cached != 'true'
        with:
          save-cache: "true"

      # One turbo invocation runs every check in parallel; --continue reports
      # all failures instead of stopping at the first. `bundle` verifies the
      # electron-vite production build compiles.
      - name: Lint, type check, format check & bundle
        run: npx -y "turbo@$TURBO_VERSION" run lint typecheck format:check bundle --continue

  # Each shard gets its own runner: run together, the three suites saturate
  # a 4-vCPU runner and take the sum of their times instead of the max.
  test:
    name: Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: desktop
            tasks: test --filter=@gamelord/desktop
          - name: ui unit
            tasks: test:unit --filter=@gamelord/ui
          - name: ui stories
            tasks: test:stories --filter=@gamelord/ui
            browser: true
    env:
      TASKS: ${{ matrix.shard.tasks }}
      NEEDS_BROWSER: ${{ matrix.shard.browser == true }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/turbo-cache-check
        id: turbo
        with:
          tasks: ${{ matrix.shard.tasks }}

      - uses: ./.github/actions/setup
        if: steps.turbo.outputs.all-cached != 'true'

      - name: Resolve Playwright version
        if: env.NEEDS_BROWSER == 'true' && steps.turbo.outputs.all-cached != 'true'
        id: playwright
        run: echo "version=$(pnpm --filter @gamelord/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: env.NEEDS_BROWSER == 'true' && steps.turbo.outputs.all-cached != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell

      # Vitest browser mode runs headless, which only needs the headless shell
      # (not full Chromium). Installing is a no-op when the cache hit. The
      # runner image usually ships every shared library the shell links
      # against, so only fall back to apt (~9s) when ldd finds a gap.
      - name: Install Playwright headless shell
        if: env.NEEDS_BROWSER == 'true' && steps.turbo.outputs.all-cached != 'true'
        run: |
          pnpm --filter @gamelord/ui exec playwright install chromium --only-shell
          shell_bin=$(find ~/.cache/ms-playwright -type f -name chrome-headless-shell | head -n 1)
          missing=$(ldd "$shell_bin" | grep "not found" || true)
          if [[ -n "$missing" ]]; then
            echo "Missing shared libraries, installing system deps:"
            echo "$missing"
            pnpm --filter @gamelord/ui exec playwright install-deps chromium-headless-shell
          fi

      - name: Run tests
        # shellcheck disable=SC2086 # TASKS is intentionally word-split
        run: npx -y "turbo@$TURBO_VERSION" run $TASKS --continue

  chromatic:
    name: Visual Regression (Chromatic)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # exitOnceUploaded: the job can't fail on visual diffs anyway
      # (exitZeroOnChanges), and Chromatic reports snapshot results through
      # its own commit status. Story render errors are already caught by the
      # Storybook project in the Tests job.
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          exitZeroOnChanges: true
          exitOnceUploaded: true
          autoAcceptChanges: main

  chromatic-skip:
    name: Visual Regression (Chromatic)
    needs: changes
    if: needs.changes.outputs.ui != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes detected — skipping"

  native-addon:
    name: Native Addon Build (macos-latest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      - name: Build native addon
        working-directory: apps/desktop/native
        run: npx node-gyp rebuild

  native-addon-skip:
    name: Native Addon Build (macos-latest)
    needs: changes
    if: needs.changes.outputs.native != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No native addon changes detected — skipping"

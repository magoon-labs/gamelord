name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# Merge-group refs are unique per queue entry (gh-readonly-queue/main/pr-N-<sha>),
# so queue runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No CI job launches Electron; skip the ~100MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # paths-filter diffs merge-group runs against merge_group.base_sha, so the
    # queue skips the same irrelevant jobs a PR run does. Skipped jobs still
    # report their required check name through the *-skip twins.
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'oxlint.config.ts'
              - 'vercel.json'
              - '.github/actions/**'
              - '.github/workflows/**'
            ui:
              - 'packages/ui/**'
              - 'apps/desktop/src/renderer/components/**'
            native:
              - 'apps/desktop/native/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  lint-typecheck-format:
    name: Lint, Type Check & Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      # One turbo invocation runs every check in parallel; --continue reports
      # all failures instead of stopping at the first. `bundle` verifies the
      # electron-vite production build compiles.
      - name: Lint, type check, format check & bundle
        run: pnpm exec turbo run lint typecheck format:check bundle --continue

  lint-typecheck-format-skip:
    name: Lint, Type Check & Format
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes detected — skipping"

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @gamelord/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell

      # Vitest browser mode runs headless, which only needs the headless shell
      # (not full Chromium). Installing is a no-op when the cache hit.
      - name: Install Playwright headless shell (Storybook story tests)
        run: pnpm --filter @gamelord/ui exec playwright install chromium --only-shell --with-deps

      - name: Run tests
        run: pnpm exec turbo run test --continue

  test-skip:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes detected — skipping"

  chromatic:
    name: Visual Regression (Chromatic)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # exitOnceUploaded: the job can't fail on visual diffs anyway
      # (exitZeroOnChanges), and Chromatic reports snapshot results through
      # its own commit status. Story render errors are already caught by the
      # Storybook project in the Tests job.
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          exitZeroOnChanges: true
          exitOnceUploaded: true
          autoAcceptChanges: main

  chromatic-skip:
    name: Visual Regression (Chromatic)
    needs: changes
    if: needs.changes.outputs.ui != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No code changes detected — skipping"

  native-addon:
    name: Native Addon Build (macos-latest)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          save-cache: "true"

      - name: Build native addon
        working-directory: apps/desktop/native
        run: npx node-gyp rebuild

  native-addon-skip:
    name: Native Addon Build (macos-latest)
    needs: changes
    if: needs.changes.outputs.native != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No native addon changes detected — skipping"

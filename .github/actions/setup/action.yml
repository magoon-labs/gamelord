name: Setup workspace
description: >-
  Install Node, pnpm, and workspace dependencies. An exact dependency-cache hit
  restores node_modules directly and skips pnpm install; a miss installs from
  a warm pnpm store.

inputs:
  save-cache:
    description: >-
      Save the dependency caches when the exact key missed. Enable in one job
      per OS so parallel jobs don't race to compress and upload the same cache.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # node_modules is fully determined by the lockfile, the workspace
    # manifests and the install filter below (bump the key prefix if the
    # filter changes). No dependency runs install scripts except electron,
    # whose binary download CI skips, so restoring it is equivalent to
    # installing. corepack's pnpm download rides along to skip its ~1s fetch.
    - name: Restore node_modules
      id: modules
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          ~/.cache/node/corepack
        key: node-modules-v2-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}

    # Corepack ships with Node 24 and resolves pnpm from `packageManager`,
    # which is faster than pnpm/action-setup's self-install.
    - name: Enable pnpm
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        MODULES_HIT: ${{ steps.modules.outputs.cache-hit }}
      run: |
        corepack enable
        if [[ "$MODULES_HIT" != "true" ]]; then
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
        fi

    - name: Restore pnpm store
      if: steps.modules.outputs.cache-hit != 'true'
      id: store
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        # A lockfile bump still starts from the previous store and only
        # downloads the delta.
        restore-keys: pnpm-store-${{ runner.os }}-

    # CI never packages the app, so skip electron-builder and its ~75MB of
    # prebuilt packaging binaries (release and nightly install everything).
    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline --filter '!@gamelord/packaging'

    - name: Save node_modules
      if: inputs.save-cache == 'true' && steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          ~/.cache/node/corepack
        key: ${{ steps.modules.outputs.cache-primary-key }}

    - name: Prune pnpm store
      if: inputs.save-cache == 'true' && steps.modules.outputs.cache-hit != 'true' && steps.store.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm store prune

    - name: Save pnpm store
      if: inputs.save-cache == 'true' && steps.modules.outputs.cache-hit != 'true' && steps.store.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.PNPM_STORE }}
        key: ${{ steps.store.outputs.cache-primary-key }}
